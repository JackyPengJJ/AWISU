name: Tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libosmesa6 libcairo2
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check src scripts tests
      - run: ruff check --select F821,F822,F823 src scripts tests
      - run: python -m unittest discover -s tests -v
        env:
          MUJOCO_GL: osmesa
          MPLBACKEND: Agg
